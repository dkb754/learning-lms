# Static site: dist/ is committed, and rebuilt here so a push to src/ can never
# ship a stale page. Python 3 is present in every Netlify build image.
[build]
  command = "python3 build.py"
  publish = "dist"

# The app is a single page that routes itself, so any bookmarked path serves it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"

# Always revalidate the page itself so a redeploy reaches him immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
